name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      # The codebase has a few existing lint errors; this reports them without blocking.
      # Remove continue-on-error once they are cleaned up.
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          NEXT_TELEMETRY_DISABLED: 1
